[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "property-scraper"
version = "0.1.0"
description = "Scrapes property listings and publishes them to RabbitMQ."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"requests>=2.31.0",
	"beautifulsoup4>=4.12.0",
	"pika>=1.3.0",
	"schedule>=1.2.0",
	"pydantic>=2.0.0",
	"pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
