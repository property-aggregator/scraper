 [project]
name = "property-scraper"
version = "0.1.0"
description = "Simple Otodom scraper MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "selenium>=4.30.0",
  "requests>=2.32.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]
