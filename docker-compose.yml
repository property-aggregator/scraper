services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: property-scraper-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: property-scraper:latest
    container_name: property-scraper-app
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      REQUEST_DELAY: ${REQUEST_DELAY}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      FIRST_PAGE_INTERVAL: ${FIRST_PAGE_INTERVAL}
      FULL_SCRAPE_TIME: ${FULL_SCRAPE_TIME}
      SCRAPER_MODE: ${SCRAPER_MODE:-scheduler}
    command: [ "sh", "-c", "python -m property_scraper.main ${SCRAPER_MODE:-scheduler}" ]
    restart: unless-stopped

volumes:
  rabbitmq_data:
